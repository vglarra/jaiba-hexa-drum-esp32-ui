[platformio]
boards_dir = .

[env:jaiba-esp32-ui]
; Vendor pioarduino base (Arduino 3.3.8) — required for the LovyanGFX RGB
; patch (it uses the ESP-IDF 5.x esp_lcd APIs). The pioarduino tool builds a
; Python venv; on hosts without python3-venv/ensurepip, the standalone `uv`
; binary is used for it (see README).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1-myboard
framework = arduino
monitor_speed = 115200

; The ESP32 display is the only board on this USB/UART path. Do not hard-code
; a port; let PlatformIO find the CH340 (or set --upload-port per invocation).
; upload_port =
; monitor_port =

extra_scripts = pre:scripts/patch_lovyangfx.py

lib_deps =
    lvgl/lvgl@9.1.0
    lovyan03/LovyanGFX@1.2.25

build_flags =
    -D LV_CONF_SKIP
    -D LV_KCONFIG_IGNORE
    -D LV_COLOR_DEPTH=16
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_FONT_MONTSERRAT_40=1
    -I./include

board_build.partitions = huge_app.csv

platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8-libs.tar.xz
